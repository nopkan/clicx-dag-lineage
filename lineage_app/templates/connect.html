<main class="connect-page">
  <header class="connect-header">
    <a class="brand" href="/"><img src="/static/clicx.svg" alt="CLICX" width="122" height="30"><span class="product-name">Lineage</span></a>
  </header>
  <section class="connection-card import-card">
    <h1>Import from S3</h1>
    $error
    <form class="import-form" action="/import" method="post">
      <input type="hidden" name="csrf" value="$csrf">
      <div class="form-row">
        <div><label for="s3-uri">S3 folder</label><input id="s3-uri" name="s3_uri" value="$s3_uri" required maxlength="1024" spellcheck="false" autocomplete="off"></div>
        <div><label for="stage">Environment</label><select id="stage" name="stage">$stages</select></div>
      </div>
      <button class="primary connect-submit" type="submit">Import data <span>↓</span></button>
    </form>
    <p class="import-hint">For fresh data, run <a href="https://d257oz8wesvwn0.cloudfront.net/dags/dp_dag_lineage_export" target="_blank" rel="noopener noreferrer">dp_dag_lineage_export ↗</a> in Airflow before importing.</p>
  </section>
</main>
